name: Build signed Android artifacts
# Publication is deliberately handled by scripts/publish-release.sh, which checks the release
# repository, version and certificate. The former jobs published to the private source repository,
# while installed applications read elie00/jelyvo-releases.
on:
  workflow_dispatch:
    inputs:
      beta:
        description: Append the beta version suffix
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: signed-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Run verification
        run: >-
          ./gradlew :music-core:test :music-youtube:test :wear-shared:test
          :app:testStandaloneDebugUnitTest :wear:testDebugUnitTest
          :app:lintStandaloneDebug :wear:lintDebug --console=plain
      - name: Configure release signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['SIGNING_KEY', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Missing release signing configuration')
          key = Path(os.environ['RUNNER_TEMP']) / 'jelyvo-release.jks'
          key.write_bytes(base64.b64decode(os.environ['SIGNING_KEY'], validate=True))
          key.chmod(0o600)
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace(' ', '\\ ')
          values = dict(storeFile=str(key), storePassword=os.environ['STORE_PASSWORD'],
                        keyAlias=os.environ['KEY_ALIAS'], keyPassword=os.environ['KEY_PASSWORD'])
          props = Path('keystore.properties')
          props.write_text(''.join(f'{k}={escape(v)}\n' for k, v in values.items()))
          props.chmod(0o600)
          PY
      - name: Build phone and watch releases
        env:
          BETA: ${{ inputs.beta }}
        run: ./gradlew :app:assembleStandaloneRelease :wear:assembleRelease -Pbeta="$BETA" -PgitHash="$GITHUB_SHA" --console=plain
      - name: Verify both signing certificates and collect artifacts
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          expected=b47ac9b86845664530b6e1a77465f210fa7b4913e77b1d44fde6a4f28fbe081d
          mkdir -p release-artifacts
          for apk in app/build/outputs/apk/standalone/release/Jelyvo.apk wear/build/outputs/apk/release/Jelyvo-Watch.apk; do
            actual=$("$signer" verify --print-certs "$apk" | sed -nE 's/.*SHA-256 digest: ([0-9a-f]+).*/\1/p' | head -1)
            test "$actual" = "$expected"
          done
          cp app/build/outputs/apk/standalone/release/Jelyvo.apk release-artifacts/
          zip -j release-artifacts/Jelyvo-Watch.zip wear/build/outputs/apk/release/Jelyvo-Watch.apk
      - uses: actions/upload-artifact@v7
        with:
          name: signed-android
          path: release-artifacts/
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/jelyvo-release.jks"
